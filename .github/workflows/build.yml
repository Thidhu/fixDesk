name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set server address
        if: ${{ vars.SERVER_URL != '' }}
        shell: bash
        run: echo '{"server":"${{ vars.SERVER_URL }}"}' > desktop/config.json
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FixDesk-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
